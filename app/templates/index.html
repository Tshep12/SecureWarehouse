<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureWarehouse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --concrete: #dcdfe1;
            --paper: #f4f5f3;
            --ink: #17191c;
            --steel: #3b4249;
            --muted: #6a7178;
            --edge: #b4babf;
            --hivis: #f5c400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
            background: var(--concrete);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .stripe {
            height: 14px;
            background: repeating-linear-gradient(-45deg, var(--hivis) 0 14px, var(--ink) 14px 28px);
            animation: wipe 1.2s cubic-bezier(.7, 0, .2, 1) both;
        }

        .stripe.bottom { animation-delay: 0.3s; }

        @keyframes wipe {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px clamp(24px, 6vw, 90px);
            max-width: 1200px;
        }

        .mark {
            width: 52px;
            height: 52px;
            background: var(--hivis);
            color: var(--ink);
            display: grid;
            place-items: center;
            font-stretch: 70%;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            animation: settle 0.8s 0.3s cubic-bezier(.3, 1.6, .5, 1) both;
        }

        @keyframes settle {
            from { transform: rotate(-35deg) scale(0.4); opacity: 0; }
            to   { transform: rotate(-4deg) scale(1); opacity: 1; }
        }

        h1 {
            font-stretch: 62%;
            font-weight: 900;
            font-size: clamp(60px, 14vw, 190px);
            line-height: 0.88;
            letter-spacing: -2px;
            animation: reveal 0.9s 0.5s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes reveal {
            from { clip-path: inset(0 0 100% 0); transform: translateY(40px); }
            to   { clip-path: inset(0 0 0 0); transform: none; }
        }

        h2 {
            margin-top: 26px;
            display: inline-block;
            align-self: flex-start;
            background: var(--ink);
            color: var(--hivis);
            font-stretch: 70%;
            font-weight: 800;
            font-size: clamp(20px, 3vw, 32px);
            padding: 8px 16px;
            animation: fade 0.7s 1s ease both;
        }

        .copy {
            margin-top: 28px;
            max-width: 46ch;
            animation: fade 0.7s 1.15s ease both;
        }

        .copy p {
            color: var(--steel);
            font-size: 18px;
            line-height: 1.6;
        }

        .copy p:first-child {
            color: var(--ink);
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 6px;
        }

        h3 {
            margin-top: 40px;
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--paper);
            border: 1.5px solid var(--ink);
            box-shadow: 5px 5px 0 0 var(--ink);
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            animation: dropIn 0.7s 1.35s cubic-bezier(.2, .9, .3, 1.15) both;
        }

        h3::before {
            content: "";
            width: 11px;
            height: 11px;
            background: #1fbf6a;
            animation: blink 2.4s steps(2, jump-none) infinite;
        }

        @keyframes blink {
            0%   { opacity: 1; }
            50%  { opacity: 0.25; }
            100% { opacity: 1; }
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-18px) rotate(-2deg); }
            to   { opacity: 1; transform: none; }
        }

        @media (max-width: 600px) {
            .hero { padding: 44px 22px; }
            .copy p { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="stripe"></div>

    <main class="hero">
        <div class="mark">S</div>

        <h1>SecureWarehouse</h1>

        <h2>Warehouse Management System</h2>

        <div class="copy">
            <p>Welcome to SecureWarehouse.</p>
            <p>Secure inventory management and monitoring.</p>
        </div>

        <h3>System Status: Online</h3>
    </main>

    <div class="stripe bottom"></div>
</body>
</html>
